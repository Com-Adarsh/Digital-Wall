<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header"><a class="brand" href="{{ '/' | relative_url }}"><span class="brand-symbol">✳</span><span>{{ site.title }}</span></a><nav><a href="{{ '/' | relative_url }}#stories">Explore</a><a class="nav-submit" href="{{ '/submit/' | relative_url }}">Submit a post <span aria-hidden="true">↗</span></a></nav></header>
  <main>{{ content }}</main>
  <footer class="site-footer"><a class="brand" href="{{ '/' | relative_url }}"><span class="brand-symbol">✳</span><span>{{ site.title }}</span></a><p>A little more of us, together.</p><a href="{{ '/submit/' | relative_url }}">Share something ↗</a><span class="footer-note">Built for our campus community</span></footer>
</body>
</html>
